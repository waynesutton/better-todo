[build]
  command = "npm run build"
  publish = "dist"

# Edge function for bot detection on shared notes
[[edge_functions]]
path = "/share/*"
function = "shareBotMeta"

# Agent consent page (MCP) must never be framed (clickjacking)
[[headers]]
  for = "/connect"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"

# SPA fallback - all routes go to index.html (React Router handles routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
